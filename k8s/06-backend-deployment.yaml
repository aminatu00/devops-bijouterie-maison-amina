
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend

spec:

  replicas: 2

  selector:
    matchLabels:
      app: bijouterie
      tier: backend

  template:
    metadata:
      labels:
        app: bijouterie
        tier: backend

    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: aminatug/bijouterie-backend:2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

    
          envFrom:
            - configMapRef:
                name: backend-config

        
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD

          # Sécurité du conteneur
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

   
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/ready
              port: 3000
            periodSeconds: 5


          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
