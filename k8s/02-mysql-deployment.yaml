
apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database

spec:
  replicas: 1


  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql
        app-group: bijouterie
        tier: database

    spec:
      containers:
        - name: mysql
          image: bijouterie-mysql:local
          imagePullPolicy: IfNotPresent

   
          ports:
            - containerPort: 3306

         
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

  
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

      
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

    
      volumes:
        - name: mysql-data
          emptyDir: {}
