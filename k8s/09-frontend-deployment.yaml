
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: frontend

spec:

  replicas: 2

  selector:
    matchLabels:
      app: bijouterie
      tier: frontend

  template:
    metadata:
      labels:
        app: bijouterie
        tier: frontend

    spec:
      containers:
        - name: frontend
          image: aminatug/bijouterie-frontend:5
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: frontend-config


          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"


          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
